<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RENIS | Plataforma Renal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:'Inter',sans-serif;
background:#020617;
background-image:radial-gradient(circle at top left,rgba(59,130,246,.15),transparent 30%),radial-gradient(circle at bottom right,rgba(139,92,246,.12),transparent 30%);
color:#e2e8f0;
min-height:100vh;
}
nav{padding:24px 8%;background:rgba(2,6,23,.92);border-bottom:1px solid rgba(255,255,255,.08)}
.logo{
font-family:'Orbitron',sans-serif;
font-size:2.5rem;
font-weight:900;
letter-spacing:8px;
background:linear-gradient(90deg,#38bdf8,#818cf8,#c084fc);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
.hero,.section{padding:60px 8%}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.hero h1{font-family:'Orbitron',sans-serif;font-size:4rem;margin-bottom:20px}
.hero h1 span{background:linear-gradient(90deg,#38bdf8,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{line-height:1.8;color:#cbd5e1}
.card,.panel,.config-box{background:rgba(15,23,42,.75);border:1px solid rgba(255,255,255,.08);border-radius:24px;backdrop-filter:blur(16px)}
.card,.config-box,.panel{padding:30px}
.panel,.config-box{margin-bottom:30px}
.btn{
padding:16px 28px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#2563eb,#7c3aed);
color:white;
font-weight:700;
font-family:'Orbitron',sans-serif;
cursor:pointer;
margin-top:20px;
}
.section-title{font-family:'Orbitron',sans-serif;letter-spacing:2px;margin-bottom:20px;color:#93c5fd}
input{
width:100%;
padding:16px;
border-radius:14px;
border:1px solid rgba(255,255,255,.08);
background:#020617;
color:white;
}
.table{width:100%;border-collapse:collapse;margin-top:20px}
.table th,.table td{padding:16px;text-align:left}
.table th{background:rgba(30,41,59,.8);font-family:'Orbitron',sans-serif}
.table td{border-bottom:1px solid rgba(255,255,255,.06)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions button{padding:10px 14px;border:none;border-radius:12px;color:white;font-weight:700;font-family:'Orbitron',sans-serif;cursor:pointer}
.epi{background:#2563eb}.ref{background:#16a34a}.tras{background:#9333ea}
.status{margin-top:12px;font-weight:700;display:flex;align-items:center;gap:10px}
.connection-indicator{
width:14px;
height:14px;
border-radius:50%;
background:#facc15;
box-shadow:0 0 15px #facc15;
animation:pulse 2s infinite;
}
.connection-online{background:#22c55e;box-shadow:0 0 18px #22c55e}
.connection-offline{background:#ef4444;box-shadow:0 0 18px #ef4444}
@keyframes pulse{
0%{transform:scale(1);opacity:1}
50%{transform:scale(1.2);opacity:.7}
100%{transform:scale(1);opacity:1}
}
footer{padding:60px 8%;margin-top:60px}
.footer-brand{font-family:'Orbitron',sans-serif;font-size:2.5rem;letter-spacing:8px;background:linear-gradient(90deg,#38bdf8,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:20px}
@media(max-width:900px){.hero{grid-template-columns:1fr}.hero h1{font-size:2.8rem}}
</style>
</head>
<body>
<nav>
<div class="logo">RENIS</div>
</nav>

<section class="hero">
<div>
<h1>Sistema <span>RENIS</span></h1>
<p>Plataforma hospitalaria renal con sincronización clínica en tiempo real.</p>
<button class="btn" onclick="window.open('https://forms.gle/pAb2KBwuUJjMxMwP6')">Abrir Formulario</button>
</div>
<div class="card">
<img src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=https://forms.gle/pAb2KBwuUJjMxMwP6" style="width:100%;border-radius:20px" alt="QR">
</div>
</section>

<section class="section">
<div class="config-box">
<h2 class="section-title">Estado del Sistema</h2>
<div id="sheetStatus" class="status">
<div id="connectionLight" class="connection-indicator"></div>
<span id="connectionText">Conectando con Google Sheets...</span>
</div>
</div>

<div class="panel">
<input id="busqueda" placeholder="Buscar paciente">
<table class="table" id="tabla">
<thead>
<tr>
<th>Identidad</th>
<th>Paciente</th>
<th>Edad</th>
<th>Diagnóstico</th>
<th>Fecha</th>
<th>Hora</th>
<th>Documentos</th>
<th>Identidad</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>
</section>

<footer>
<div class="footer-brand">RENIS</div>
<p>Plataforma desarrollada por <strong style="color:#93c5fd">Dr. Luis Ernesto Guardado</strong></p>
</footer>

<script>
const OPENSHEET_URL='https://opensheet.elk.sh/1cS2KN-prJmVvPxB4Tm5JrpxS_noDY4Nyj6KUZ73KE10/Respuestas%20de%20formulario%202';

let pacientes={};

function actualizarConexion(online,texto){
const status=document.getElementById('sheetStatus');
const light=document.getElementById('connectionLight');
const text=document.getElementById('connectionText');

text.textContent=texto;

if(online){
status.style.color='#4ade80';
light.className='connection-indicator connection-online';
}else{
status.style.color='#ef4444';
light.className='connection-indicator connection-offline';
}
}

function abrirDocumento(url){
if(!url || url.trim()===''){
alert('Documento aún no generado por Autocrat');
return;
}

let cleanUrl=url.trim();

if(cleanUrl.includes('drive.google.com')){
cleanUrl=cleanUrl
.replace('/edit?usp=drivesdk','/view')
.replace('/edit','/view');
}

console.log('Abriendo documento:',cleanUrl);
window.open(cleanUrl,'_blank');
}

function renderizarPacientes(){
const tbody=document.querySelector('#tabla tbody');
tbody.innerHTML='';

Object.keys(pacientes).forEach(key=>{
const p=pacientes[key];

const fila=document.createElement('tr');
fila.innerHTML=`
<td>${p.Expediente}</td>
<td><strong>${p.Nombre}</strong></td>
<td>${p.Edad}</td>
<td>${p.Diagnostico}</td>
<td>${p.FechaRegistro}</td>
<td>${p.HoraRegistro}</td>
<td>
<div class="actions">
<button class="epi" onclick="abrirDocumento('${p.EpicrisisDOCX}')">Epicrisis</button>
<button class="ref" onclick="abrirDocumento('${p.ReferenciaDOCX}')">Referencia</button>
<button class="tras" onclick="abrirDocumento('${p.TrasladoDOCX}')">Traslado</button>
<button style="background:#f59e0b" onclick="abrirDocumento('${p.FotoIdentidad}')">Identidad</button>
</div>
</td>
<td>
<button style="background:#0ea5e9;padding:10px 14px;border:none;border-radius:12px;color:white;font-weight:700;font-family:'Orbitron',sans-serif;cursor:pointer" onclick="abrirDocumento('${p.FotoIdentidad}')">Ver Foto</button>
</td>`;

tbody.appendChild(fila);
});
}

async function cargarPacientes(){
try{
const response=await fetch(OPENSHEET_URL);

if(!response.ok){
throw new Error('No se pudo conectar');
}

const datos=await response.json();

pacientes={};

(datos || []).forEach((p,index)=>{
const nombre=(p['NOMBRE ']||'').trim();
const apellido1=(p['PRIMER APELLIDO ']||'').trim();
const apellido2=(p['SEGUNDO PELLIDO ']||'').trim();

pacientes['PACIENTE_'+index]={
Nombre:`${nombre} ${apellido1} ${apellido2}`.trim(),
Expediente:p['NUMERO DE IDENTIDAD '] || 'SIN IDENTIDAD',
Edad:p['EDAD'] || '--',
Diagnostico:p['1. DIAGNOSTICO '] || p['2. DIAGNOSTICO'] || 'No especificado',
FechaRegistro:p['FECHA DE INGRESO'] || '--',
HoraRegistro:p['HORA DE INGRESO HOSPITALARIO'] || '--',
EpicrisisDOCX:p['Link to merged Doc - epicrisis 2.0'] || p['Merged Doc URL - epicrisis 2.0'] || '',
ReferenciaDOCX:p['Link to merged Doc - referencias 2.0'] || p['Merged Doc URL - referencias 2.0'] || '',
TrasladoDOCX:p['Link to merged Doc - traslado 2.0'] || p['Merged Doc URL - traslado 2.0'] || '',
FotoIdentidad:p['FOTO DE LA IDENTIDAD '] || p['FOTO DE LA IDENTIDAD1'] || ''
};
});

renderizarPacientes();
actualizarConexion(true,'RENIS conectado en tiempo real con Google Sheets');

}catch(error){
console.error(error);
actualizarConexion(false,'RENIS fuera de línea');
}
}

function configurarBusqueda(){
document.getElementById('busqueda').addEventListener('keyup',function(){
const valor=this.value.toLowerCase();
const filas=document.querySelectorAll('#tabla tbody tr');

filas.forEach(fila=>{
const texto=fila.innerText.toLowerCase();
fila.style.display=texto.includes(valor)?'':'none';
});
});
}

async function iniciarSistema(){
configurarBusqueda();
await cargarPacientes();
console.assert(OPENSHEET_URL.includes('opensheet'),'OpenSheet requerido');
}

iniciarSistema();
</script>
</body>
</html>
